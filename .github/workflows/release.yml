name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          node -e "
            const { version } = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error(\`Tag \${tag} does not match package.json version \${version}\`);
              process.exit(1);
            }
          "

      - name: Validate syntax and Docker Compose config
        run: |
          node --check index.js
          node --check client.js
          docker compose -f search/docker-compose.yml config -q

      - name: Pack distribution tarball
        run: npm pack

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release and attach tarball
        uses: softprops/action-gh-release@v3
        with:
          files: dsh-llm-third-party-native-*.tgz
          generate_release_notes: true
